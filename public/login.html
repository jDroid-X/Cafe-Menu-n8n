<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login – CafeMenu AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/theme.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 2rem;
      width: 320px;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
      color: #fff;
    }
    h2 { margin-top: 0; text-align: center; font-weight: 600; }
    .input-group { margin-bottom: 1rem; }
    label { display: block; margin-bottom: 0.4rem; font-size: 0.9rem; }
    input { width: 100%; padding: 0.6rem; border: none; border-radius: 8px; background: rgba(255,255,255,0.25); color:#fff; font-size:0.95rem; }
    input::placeholder { color:#e0e0e0; }
    button { width:100%; padding:0.7rem; background:var(--brand-primary); border:none; border-radius:8px; color:#fff; font-weight:600; cursor:pointer; transition:background 0.3s; }
    button:hover { background:#e57c00; }
    .msg { margin-top:1rem; text-align:center; font-size:0.9rem; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Admin Login</h2>
    <div class="input-group">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="admin@example.com" />
    </div>
    <div class="input-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Password" />
    </div>
    <button id="loginBtn">Sign In</button>
    <div class="msg" id="msg"></div>
  </div>
  <script>
    const loginBtn = document.getElementById('loginBtn');
    const msg = document.getElementById('msg');
    loginBtn.addEventListener('click', async () => {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      if (!email || !password) {
        msg.textContent = 'Please enter both email and password.';
        return;
      }
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: email, password })
        });
        if (!res.ok) {
          const err = await res.json();
          msg.textContent = err.error || 'Login failed';
          return;
        }
        const data = await res.json();
        const auth = { email, role: data.role || 'Administrator', loggedInAt: new Date().toISOString() };
        localStorage.setItem('jdroid_auth', JSON.stringify(auth));
        localStorage.setItem('jdroid_token', data.token);
        window.location.href = '/';
      } catch (e) {
        msg.textContent = 'Network error';
      }
    });
  </script>
</body>
</html>
