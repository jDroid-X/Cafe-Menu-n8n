<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login – CafeMenu AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/theme.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 2rem;
      width: 320px;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
      color: #fff;
    }
    h2 { margin-top: 0; text-align: center; font-weight: 600; }
    .input-group { margin-bottom: 1rem; }
    label { display: block; margin-bottom: 0.4rem; font-size: 0.9rem; }
    input { width: 100%; padding: 0.6rem; border: none; border-radius: 8px; background: rgba(255,255,255,0.25); color:#fff; font-size:0.95rem; }
    input::placeholder { color:#e0e0e0; }
    button { width:100%; padding:0.7rem; background:var(--brand-primary); border:none; border-radius:8px; color:#fff; font-weight:600; cursor:pointer; transition:background 0.3s; }
    button:hover { background:#e57c00; }
    .msg { margin-top:1rem; text-align:center; font-size:0.9rem; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Admin Login</h2>
    <div class="input-group">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="admin@example.com" />
    </div>
    <div class="input-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Password" />
    </div>
    <button id="loginBtn">Sign In</button>
    <div class="msg" id="msg"></div>
  </div>
  <script>
  // UI elements
  const loginBtn = document.getElementById('loginBtn');
  const msg = document.getElementById('msg');
  const statusDiv = document.createElement('div');
  statusDiv.id = 'status';
  statusDiv.className = 'msg';
  document.querySelector('.card').appendChild(statusDiv);
  const startBtn = document.createElement('button');
  startBtn.id = 'startServersBtn';
  startBtn.textContent = 'Start Local Servers';
  startBtn.style.display = 'none';
  startBtn.style.marginTop = '1rem';
  document.querySelector('.card').appendChild(startBtn);

  // Helper to check backend health
  async function checkHealth() {
    try {
      const res = await fetch('http://localhost:3585/api/health');
      if (res.ok) {
        statusDiv.textContent = 'Local server is running.';
        startBtn.style.display = 'none';
        return true;
      }
    } catch (e) {}
    statusDiv.textContent = 'Local server is not reachable.';
    startBtn.style.display = 'inline-block';
    return false;
  }

  // Try health check on page load
  checkHealth();

  // Click handler to launch the batch file (downloads it, user must run)
  startBtn.addEventListener('click', () => {
    // Provide the batch file for the user to run
    window.location.href = 'RunCaffeMenu.bat';
    statusDiv.textContent = 'Please run the downloaded RunCaffeMenu.bat to start services.';
  });

  // Normal login flow – only works when the server is up
  loginBtn.addEventListener('click', async () => {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    if (!email || !password) {
      msg.textContent = 'Please enter both email and password.';
      return;
    }
    try {
      const endpoint = window.location.origin.includes(':3585') || window.location.protocol === 'file:'
        ? '/api/auth/login'
        : (window.location.port ? '/api/auth/login' : 'http://localhost:3585/api/auth/login');

      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: email, password })
      });
      if (!res.ok) {
        const err = await res.json();
        msg.textContent = err.error || 'Login failed';
        return;
      }
      const data = await res.json();
      const auth = { email, role: data.user?.role || data.role || 'Administrator', loggedInAt: new Date().toISOString() };
      localStorage.setItem('jdroid_auth', JSON.stringify(auth));
      if (data.token) {
        localStorage.setItem('jdroid_token', data.token);
      }
      window.location.href = './index.html';
    } catch (e) {
      msg.textContent = 'Network error – ensure the server is running.';
    }
  });
  </script>
</body>
</html>
